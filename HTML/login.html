<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="meta-theme-color" content="#090c15" />
  <title>Acesso ao Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/CSS/login.css" />
</head>
<body>
  <!-- Fundo Atmosférico Escuro com Brilho Radial -->
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="ambient-glow"></div>
  </div>

  <!-- Seletor Dinâmico de 50 Paletas Monocromáticas -->
  <aside class="palette-dock" aria-label="Personalização de Tema">
    <button
      type="button"
      class="palette-toggle-btn"
      id="btn-toggle-palette"
      aria-expanded="false"
      aria-controls="palette-panel"
    >
      <span class="swatch-dot" id="current-swatch-dot"></span>
      <span id="current-palette-label">Paleta (1/50)</span>
    </button>

    <div class="palette-panel" id="palette-panel" hidden>
      <div class="palette-tabs" role="tablist" aria-label="Famílias de cores">
        <button type="button" class="tab-btn active" data-family="azul" role="tab">Azul</button>
        <button type="button" class="tab-btn" data-family="verde" role="tab">Verde</button>
        <button type="button" class="tab-btn" data-family="amarelo" role="tab">Amarelo</button>
        <button type="button" class="tab-btn" data-family="vermelho" role="tab">Vermelho</button>
      </div>
      <div class="palette-grid" id="palette-grid"></div>
    </div>
  </aside>

  <!-- Cartão Central de Autenticação Firebase -->
  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="login-heading">
      <header class="card-header">
        <div class="brand-badge">
          <span class="brand-dot"></span>
          <span id="hero-project-name">Firebase Workspace</span>
        </div>
        <h1 id="login-heading">
          Bem-vindo ao <span class="accent-word" id="brand-accent-name">LOGIN</span>
        </h1>
        <p class="card-subtitle" id="form-subtitle">
          Verificando conexão com Firebase Auth...
        </p>
      </header>

      <form id="auth-form" novalidate>
        <div class="input-group">
          <label for="input-usuario">Usuário ou E-mail</label>
          <div class="input-field-wrap">
            <input
              type="text"
              id="input-usuario"
              name="usuario"
              autocomplete="username"
              placeholder="seu.usuario ou email@dominio.com"
              required
            />
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
          </div>
        </div>

        <div class="input-group">
          <label for="input-senha">Senha</label>
          <div class="input-field-wrap">
            <input
              type="password"
              id="input-senha"
              name="senha"
              autocomplete="current-password"
              placeholder="Mínimo de 6 caracteres"
              minlength="6"
              required
            />
            <button
              type="button"
              class="input-icon btn-eye"
              id="btn-toggle-senha"
              aria-label="Mostrar ou ocultar senha"
            >
              <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
              <svg id="icon-eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden>
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-feedback" id="auth-feedback" aria-live="polite"></div>

        <button type="submit" class="btn-submit" id="btn-submit">
          <span id="btn-submit-text">ENTRAR</span>
        </button>

        <div class="auth-divider" role="separator">
          <span>ou</span>
        </div>

        <button type="button" class="btn-google" id="btn-google-login">
          <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
            <path fill="#34A853" d="M12 24c3.3 0 6.08-1.09 8.11-2.96l-3.88-3.05c-1.1.74-2.51 1.18-4.23 1.18-3.26 0-6.02-2.2-7-5.16H1.01v3.14C3.05 21.2 7.24 24 12 24Z"/>
            <path fill="#FBBC05" d="M5 14.01c-.25-.74-.39-1.54-.39-2.36 0-.82.14-1.62.39-2.36V6.15H1.01C.37 7.43 0 8.87 0 10.4c0 1.53.37 2.97 1.01 4.25l3.99-3.14Z"/>
            <path fill="#EA4335" d="M12 4.75c1.79 0 3.41.62 4.68 1.82l3.51-3.51C18.07 1.19 15.3 0 12 0 7.24 0 3.05 2.8 1.01 6.85l3.99 3.14c.98-2.96 3.74-5.24 7-5.24Z"/>
          </svg>
          <span id="btn-google-text">Continuar com Google</span>
        </button>

        <div class="auth-switch-row">
          <button type="button" class="btn-link-mode" id="btn-toggle-mode">
            Não tem conta? Criar acesso Firebase
          </button>
        </div>
      </form>
    </section>

    <p class="platform-caption">
      Autenticação protegida • <strong id="mobile-project-name">Firebase</strong>
    </p>
  </main>

  <script type="module" src="/JS/login.js"></script>
</body>
</html>
